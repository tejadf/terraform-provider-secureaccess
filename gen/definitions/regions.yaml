---
name: Regions
rest_endpoint: /deployments/v2/regions
doc_category: Connect
no_resource: true
no_id: true
no_import: true
ds_description: >-
  This data source can read the regions available for Network Tunnel Groups, together with the BGP peer information of the organization.
attributes:
  - model_name: regions
    type: List
    description: List of available regions.
    attributes:
      - model_name: name
        type: String
        description: Display name of the region.
        example: US East 1
      - model_name: region
        type: String
        description: Region identifier, used as the `region` of a Network Tunnel Group.
        example: us-east-1
      - model_name: description
        type: String
        description: Description of the region.
        example: US East (N. Virginia)
      - model_name: continent
        type: String
        description: Continent of the region.
        example: North America
  - model_name: asNumber
    data_path: ["bgp"]
    tf_name: bgp_as_number
    type: String
    description: BGP autonomous system (AS) number of Secure Access.
    example: "64512"
  - model_name: peerIPs
    data_path: ["bgp"]
    tf_name: bgp_peer_ips
    type: List
    element_type: String
    description: BGP peer IP addresses of Secure Access.
    example: 169.254.0.9
  - model_name: peerRange
    data_path: ["bgp"]
    tf_name: bgp_peer_range
    type: String
    description: BGP peer IP range of Secure Access.
    example: 169.254.0.0/24
